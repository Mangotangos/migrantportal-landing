<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOCKUP v2 — Navigator / Responder dashboard (org style)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#007A82;--primary-lt:#E0F4F5;--coral:#D13A06;--bg:#F5F3EE;--surface:#fff;--text:#1A1614;--text-sub:#6E6560;--border:#E5E0D8;--gray-100:#F0EDE8;--gray-400:#756E68;--shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--font-head:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif}
body{font-family:var(--font-body);color:var(--text);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
button{font-family:var(--font-body);cursor:pointer}
.mock-bar{background:#1A1614;color:#fff;font-size:12px;padding:8px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mock-bar b{color:#F5B301}
.mock-bar .sep{width:1px;height:16px;background:rgba(255,255,255,.3)}
.mock-bar button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 12px;font-size:12px;font-weight:600}
.mock-bar button.on{background:#fff;color:#1A1614}
.mock-bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:12px;padding:0 24px}
.topbar-logo{font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:-.3px}
.topbar-logo span{color:var(--primary)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-link{font-size:13px;font-weight:600;color:var(--text-sub);padding:6px 10px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:20px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.user-name{font-size:13px;font-weight:600}
.layout{display:flex;flex:1}
.sidebar{width:224px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding-bottom:20px}
.chip{display:flex;align-items:center;gap:10px;padding:16px 14px;background:linear-gradient(135deg,#005A60,#007A82);margin-bottom:12px}
.chip-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.chip-name{font-family:var(--font-head);font-size:14px;font-weight:800;color:#fff;line-height:1.2}
.chip-role{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.sb-sec{padding:0 12px;margin-bottom:4px}
.sb-label{font-size:10px;font-weight:700;color:var(--gray-400);letter-spacing:.08em;text-transform:uppercase;padding:10px 8px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-sub)}
.sb-item.active{background:var(--primary-lt);color:#006a72;font-weight:700}
.sb-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.main{flex:1;padding:28px 28px 48px;min-width:0}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:var(--font-head);font-size:24px;font-weight:800}
.page-sub{font-size:13px;color:var(--text-sub);margin-top:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-primary{background:var(--coral);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;border:none}
.btn-outline{background:var(--surface);color:var(--text-sub);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border)}
.btn-sm{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700}
.btn-sm.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--primary)}
.nudge{margin-bottom:20px;background:var(--primary-lt);border:1px solid var(--primary);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.nudge-l{display:flex;align-items:center;gap:14px}
.nudge-i{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.nudge b{font-size:14px}
.nudge p{font-size:12.5px;color:var(--text-sub);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow-sm)}
.stat-l{font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:8px}
.stat-v{font-family:var(--font-head);font-size:30px;font-weight:800;line-height:1}
.stat-d{font-size:12px;margin-top:6px;color:var(--gray-400)}
.stat-d.up{color:#15803d}
.two{display:grid;grid-template-columns:1fr 300px;gap:20px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h{font-family:var(--font-head);font-size:16px;font-weight:800}
.see{font-size:13px;font-weight:600;color:var(--primary)}
.card{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:24px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--gray-100);border-bottom:1px solid var(--border)}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.b-urgent{background:#fef2f2;color:#dc2626}.b-high{background:#fff7ed;color:#ea580c}.b-medium{background:#fefce8;color:#ca8a04}.b-open{background:#f0fdf4;color:#16a34a}.b-wait{background:#f0edE8;color:#6E6560}.b-done{background:#e0f4f5;color:#006a72}
.feed-i{display:flex;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.feed-i:last-child{border-bottom:none}
.feed-dot{width:32px;height:32px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.feed-t{font-size:13px;line-height:1.35}.feed-m{font-size:11.5px;color:var(--text-sub);margin-top:2px}
.empty{padding:30px 20px;text-align:center;color:var(--text-sub);font-size:13px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.note{font-size:11.5px;color:var(--text-sub);margin:-14px 0 24px;padding-left:2px}
</style>
</head>
<body>
<div class="mock-bar"><b>MOCKUP v2</b> not live
  <span class="sep"></span>View as:
  <button id="bn" onclick="setRole('nav')">Navigator</button>
  <button id="br" onclick="setRole('resp')">Responder</button>
  <span class="sep"></span>Data:
  <button id="bd" onclick="setState('data')">With data</button>
  <button id="be" onclick="setState('empty')">Empty (real today)</button>
  <span class="sep"></span>
  <label id="flagwrap"><input type="checkbox" id="flag" onchange="render()"> Responder has can_submit_needs</label>
</div>
<div class="topbar">
  <div class="topbar-logo">Migrant<span>Portal</span></div>
  <div class="topbar-right">
    <span class="nav-link">Browse Needs</span><span class="nav-link">Notifications (2)</span>
    <div class="user-chip"><div class="user-avatar">T</div><span class="user-name" id="uname"></span></div>
  </div>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="chip"><div class="chip-icon" id="cicon"></div><div><div class="chip-name" id="cname"></div><div class="chip-role" id="crole"></div></div></div>
    <div class="sb-sec"><div class="sb-label">Overview</div><div id="sbitems"></div></div>
    <div class="sb-sec" style="margin-top:16px"><div class="sb-label">Account</div>
      <div class="sb-item">👤 My Profile</div><div class="sb-item">↪ Sign Out</div></div>
  </aside>
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title" id="title"></h1><div class="page-sub" id="sub"></div></div>
      <div class="actions" id="hactions"></div>
    </div>
    <div class="nudge" id="nudge"><div class="nudge-l"><div class="nudge-i">＋</div><div><b id="nt"></b><p id="np"></p></div></div>
      <div class="actions" id="nactions"></div></div>
    <div class="stats" id="stats"></div>
    <div class="two">
      <div id="left"></div>
      <div><div class="sec-row"><div class="sec-h">Recent Activity</div></div>
        <div class="card" id="feed"></div></div>
    </div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
let role='nav',state='data';
const bo=l=>`<button class="btn-outline">${l}</button>`, bp=l=>`<button class="btn-primary">${l}</button>`;
const table=(head,rows)=>`<div class="card"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
const section=(h,inner)=>`<div class="sec-row"><div class="sec-h">${h}</div><span class="see">See all →</span></div>${inner}`;
const empty=(t,p)=>`<div class="card"><div class="empty"><b>${t}</b>${p}</div></div>`;
const U='<span class="badge b-urgent">Urgent</span>',H='<span class="badge b-high">High</span>',M='<span class="badge b-medium">Medium</span>';

function navView(){
 const e=state==='empty';
 const needs=e?empty('No needs yet','Add a family, then post the first need from your caseload.'):table(['Need','Family','Urgency','Responses','Action'],[
  ['Winter coats, 3 children','Garcia family',H,'<span class="badge b-open">2 responders</span>','<button class="btn-sm">Mark fulfilled</button>'],
  ['Rent assistance, 1 month','Ortiz family',U,'<span class="badge b-wait">Awaiting response</span>','<button class="btn-sm ghost">View</button>'],
  ['Groceries, 2 weeks','Nguyen family',M,'<span class="badge b-done">Fulfilled</span>','<button class="btn-sm ghost">View</button>']]);
 return {uname:'Test Navigator',cname:'Test Navigator Org',crole:'Navigator',icon:'🧭',
  items:[['▦','Dashboard',1],['📝','My Needs',e?'':'3'],['👨‍👩‍👧','Families'],['🔖','Bookmarks'],['📚','Resources']],
  title:'Navigator Dashboard',sub:"Manage your families and the needs you've submitted",
  h:bo('Browse Needs')+bp('+ Submit a Need'),
  nudge:e?["You haven't submitted a need yet",'Add a family, post a real need from your caseload, and get matched with a local responder.',bo('Add a Family')+bp('Submit Your First Need')]:null,
  stats:e?[['Families','0','Added by you'],['Open Needs','0','Active now','up'],['Awaiting Response','0','No responder yet'],['Fulfilled','0','All time']]
          :[['Families','3','Added by you'],['Open Needs','2','Active now','up'],['Awaiting Response','1','No responder yet'],['Fulfilled','1','All time']],
  left:section('My Recent Needs',needs),
  note:'Needs go active the moment they are submitted (no admin approval), so there is no "Pending" card.',
  feed:e?[]:[['🔔','A responder offered to help with <b>Winter coats</b>','2 hours ago'],['✅','<b>Groceries</b> marked fulfilled','Yesterday'],['📝','You submitted <b>Rent assistance</b>','2 days ago']]};
}
function respView(){
 const e=state==='empty', f=$('flag').checked;
 const near=e?empty('No open needs near you yet','We will notify you when a family within 25 miles needs help. Change the distance in your profile.'):table(['Need','Distance','Urgency','Category'],[
  ['Winter coats, 3 children','3.2 mi',H,'Clothing'],['Grocery assistance','6.8 mi',M,'Food'],['Ride to medical appointment','11 mi',U,'Transport']]);
 const mine=e?empty('No responses yet','Offers you make show up here so you can follow them to the end.'):table(['Need','My offer','Status'],[
  ['Winter coats, 3 children','Offered Oct 30','<span class="badge b-open">Offered</span>'],['Groceries, 2 weeks','Offered Oct 24','<span class="badge b-done">Fulfilled</span>']]);
 const items=[['▦','Dashboard',1],['📍','Needs Near You',e?'':'3'],['💬','My Responses']];
 if(f)items.push(['👨‍👩‍👧','Families'],['📝','My Submitted Needs']);
 items.push(['🔖','Bookmarks'],['💝','Donations'],['📚','Resources']);
 return {uname:'Test Responder',cname:'Test Responder',crole:'Responder · Volunteer'+(f?' · can submit':''),icon:'🤝',items,
  title:'Responder Dashboard',sub:'Find families nearby and follow the help you have offered',
  h:bo('Browse All Needs')+(f?bo('+ Submit a Need'):'')+bp('Help a Family Nearby'),
  nudge:e?["You haven't responded to a need yet",'As soon as a family near you needs help, you will see it here and get a notification.',bo('Set My Location')+bp('Browse All Needs')]:null,
  stats:e?[['Open Near You','0','Within 25 mi'],['My Responses','0','All time'],['Fulfilled','0','Families helped'],['Saved','0','Bookmarked needs']]
          :[['Open Near You','3','Within 25 mi','up'],['My Responses','2','All time'],['Fulfilled','1','Families helped'],['Saved','0','Bookmarked needs']],
  left:section('Needs Near You',near)+section('My Responses',mine),
  note:'Responders never see family names or private notes (the API strips them), so no family column here.',
  feed:e?[]:[['📍','New need posted <b>3 mi</b> from you','1 hour ago'],['💬','A navigator replied to your offer','Yesterday'],['✅','<b>Groceries</b> fulfilled, thank you','3 days ago']]};
}
function render(){
 const d=role==='nav'?navView():respView();
 $('bn').className=role==='nav'?'on':'';$('br').className=role==='resp'?'on':'';
 $('bd').className=state==='data'?'on':'';$('be').className=state==='empty'?'on':'';
 $('flagwrap').style.display=role==='resp'?'flex':'none';
 $('uname').textContent=d.uname;$('cname').textContent=d.cname;$('crole').textContent=d.crole;$('cicon').textContent=d.icon;
 $('sbitems').innerHTML=d.items.map(i=>`<div class="sb-item${i[2]===1?' active':''}">${i[0]} ${i[1]}${i[2]&&i[2]!==1?`<span class="sb-badge">${i[2]}</span>`:''}</div>`).join('');
 $('title').textContent=d.title;$('sub').textContent=d.sub;$('hactions').innerHTML=d.h;
 $('nudge').style.display=d.nudge?'flex':'none';
 if(d.nudge){$('nt').textContent=d.nudge[0];$('np').textContent=d.nudge[1];$('nactions').innerHTML=d.nudge[2];}
 $('stats').innerHTML=d.stats.map(s=>`<div class="stat"><div class="stat-l">${s[0]}</div><div class="stat-v">${s[1]}</div><div class="stat-d ${s[3]||''}">${s[2]}</div></div>`).join('');
 $('left').innerHTML=d.left+`<div class="note">${d.note}</div>`;
 $('feed').innerHTML=d.feed.length?d.feed.map(x=>`<div class="feed-i"><div class="feed-dot">${x[0]}</div><div><div class="feed-t">${x[1]}</div><div class="feed-m">${x[2]}</div></div></div>`).join(''):'<div class="empty"><b>Nothing yet</b>Activity from your needs and responses will appear here.</div>';
}
function setRole(r){role=r;render();}
function setState(s){state=s;render();}
const q=new URLSearchParams(location.search);
role=q.get('role')==='resp'?'resp':'nav';state=q.get('state')==='empty'?'empty':'data';
if(q.get('flag')==='1')$('flag').checked=true;
render();
</script>
</body>
</html>
