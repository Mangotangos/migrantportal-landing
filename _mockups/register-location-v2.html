<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mockup v2: zip-first location</title>
<style>
:root{--teal:#0e9aa7;--teal-d:#0b7580;--text:#1f2937;--g200:#e5e7eb;--g400:#9ca3af;--g600:#4b5563;--red:#b91c1c;--green:#047857}
body{font-family:Inter,system-ui,sans-serif;background:#f6f7f9;margin:0;padding:24px;color:var(--text)}
.card{background:#fff;border-radius:12px;padding:28px;max-width:540px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:18px}h2{font-size:20px;margin:0 0 6px}.sub{font-size:14px;color:var(--g600);margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--g200);border-radius:8px;font-size:15px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.row{display:flex;gap:12px}.row>*{flex:1}
.result{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px;display:none}
.ok{display:block;background:#ecfdf5;color:var(--green)}.bad{display:block;background:#fef2f2;color:var(--red)}
.alt{font-size:13px;margin-top:10px;color:var(--g600)}
.alt a,.link{color:var(--teal-d);cursor:pointer;text-decoration:underline;background:none;border:none;font:inherit;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--g200);border-radius:7px;padding:7px 12px;font-size:13px;background:#fff;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--teal);background:#f0fbfb}
.small{font-size:12px;color:var(--g600);margin-top:6px}
.mini{margin-top:28px;max-width:540px}
.mini .box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:13px}
pre{background:#111827;color:#d1fae5;padding:12px;border-radius:8px;font-size:12px;overflow:auto;margin:8px 0 0}
button.go{margin-top:24px;width:100%;padding:13px;border:none;border-radius:8px;background:var(--g200);color:var(--g400);font-weight:700;font-size:15px}
button.go.ready{background:var(--teal);color:#fff;cursor:pointer}
#manual{display:none}
</style></head><body>
<h1>Register step 2 &mdash; location, v2 (mockup, not committed)</h1>
<div class="card">
  <h2>Where are you?</h2>
  <div class="sub">We use this to show you needs near you. Works anywhere in the US.</div>

  <label for="zip">ZIP code</label>
  <input id="zip" inputmode="numeric" maxlength="5" placeholder="e.g. 66062" autocomplete="postal-code">
  <div class="result" id="res"></div>
  <div class="alt"><button class="link" id="geo">Use my current location</button> &nbsp;·&nbsp; <button class="link" id="man">Enter city and state instead</button></div>

  <div id="manual">
    <div class="row">
      <div><label for="city">City</label><input id="city" placeholder="Austin" autocomplete="address-level2"></div>
      <div style="max-width:110px"><label for="st">State</label><select id="st"></select></div>
    </div>
    <div class="small">We'll look up the exact spot from your city and state.</div>
  </div>

  <label for="rad">How far will you travel? <span style="font-weight:400;color:var(--g600)">(responders)</span></label>
  <select id="rad"><option>5 miles</option><option selected>15 miles</option><option>25 miles</option><option>50 miles</option><option>Anywhere in my state</option></select>

  <label>Quick pick <span style="font-weight:400;color:var(--g600)">(Kansas City area, our launch region)</span></label>
  <div class="chips" id="chips"></div>

  <button class="go" id="go">Continue</button>
</div>

<div class="mini"><div class="box"><b>What gets sent to <code>/auth/register</code></b> (fields already exist on the backend)
<pre id="payload">{}</pre></div></div>

<script>
const $=id=>document.getElementById(id);
const STATES="AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC".split(" ");
$('st').innerHTML='<option value="">--</option>'+STATES.map(s=>`<option>${s}</option>`).join('');
const QUICK=[["Kansas City, MO","64106"],["Kansas City, KS","66101"],["Overland Park, KS","66204"],["Olathe, KS","66061"],["Independence, MO","64050"]];
QUICK.forEach(([l,z])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{$('zip').value=z;lookup(z)};$('chips').appendChild(b)});
let place=null;
function show(){
  const r=$('res');
  if(place){r.className='result ok';r.textContent=`✓ ${place.city}, ${place.state} ${place.zip||''}`.trim();}
  $('go').className='go'+(place?' ready':'');
  $('payload').textContent=JSON.stringify(place?{city:place.city,state:place.state,zip_code:place.zip||null,lat:place.lat,lng:place.lng,notification_radius:$('rad').value}:{},null,2);
}
async function lookup(z){
  place=null;const r=$('res');
  if(!/^\d{5}$/.test(z)){r.className='result';r.textContent='';show();return;}
  r.className='result';r.textContent='';
  try{
    const x=await fetch('https://api.zippopotam.us/us/'+z);
    if(!x.ok)throw 0;const j=(await x.json()).places[0];
    place={city:j['place name'],state:j['state abbreviation'],zip:z,lat:+j.latitude,lng:+j.longitude};
  }catch(e){r.className='result bad';r.textContent=`We couldn't find ZIP ${z}. Check it, or enter city and state instead.`;}
  show();
}
$('zip').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');lookup(e.target.value)});
$('man').onclick=()=>{$('manual').style.display='block'};
async function manual(){
  const c=$('city').value.trim(),s=$('st').value;if(!c||!s){place=null;show();return;}
  try{
    const x=await fetch(`https://api.zippopotam.us/us/${s.toLowerCase()}/${encodeURIComponent(c.toLowerCase())}`);
    if(!x.ok)throw 0;const j=(await x.json()).places[0];
    place={city:c.replace(/\b\w/g,m=>m.toUpperCase()),state:s,zip:j['post code'],lat:+j.latitude,lng:+j.longitude};
    $('res').className='result ok';$('res').textContent=`✓ ${place.city}, ${place.state}`;
  }catch(e){place=null;$('res').className='result bad';$('res').textContent=`We couldn't find "${c}, ${s}". Check the spelling.`;}
  show();
}
$('city').addEventListener('change',manual);$('st').addEventListener('change',manual);
$('rad').addEventListener('change',show);
$('geo').onclick=()=>{
  if(!navigator.geolocation){$('res').className='result bad';$('res').textContent='Location is not available in this browser. Enter a ZIP instead.';return;}
  navigator.geolocation.getCurrentPosition(async p=>{
    place={city:'Your location',state:'',zip:null,lat:+p.coords.latitude.toFixed(3),lng:+p.coords.longitude.toFixed(3)};
    $('res').className='result ok';$('res').textContent='✓ Using your current location (approximate)';show();
  },()=>{$('res').className='result bad';$('res').textContent='Location permission was denied. Enter a ZIP instead.';});
};
show();
</script></body></html>
